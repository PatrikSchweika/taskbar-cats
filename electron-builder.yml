# Packaging for the Windows backend.
#
# The point of this file is that an end user needs no toolchain: CI compiles the
# native taskbar helper once per release and it ships as a prebuilt binary
# inside the package. Nothing here is used by the GNOME extension, which is
# installed by tools/cli.ts instead.

# Deliberately still says ubuntu-cats, and must keep saying it. NSIS derives
# the uninstall registry key from this, so it is how an installer finds the
# copy already on the machine and upgrades it in place. Changing it would
# leave everyone on 1.2.0 with a second install beside the first. Nobody ever
# sees it; productName is the name that shows.
appId: com.github.patrikschweika.ubuntu-cats
# Hyphens rather than spaces, and a literal rather than ${productName}, which
# contains one: GitHub rewrites spaces in an uploaded asset's name to dots, so
# a file with a space in it ends up called something other than what latest.yml
# says it is, and electron-updater cannot find it.
#
# Every part of the name earns its place on a release page that also carries
# the GNOME extension: which platform, which architecture, and which of the two
# shapes of the same app. This covers the portable zip; nsis overrides it below
# for the installer.
artifactName: Taskbar-Cats-${version}-windows-${arch}-portable.${ext}
# Shown in the installer, the Start menu and Task Manager. It also decides
# app.getName(), and so where settings.json lives: renaming the product moved
# that from %APPDATA%\Ubuntu Cats to %APPDATA%\Taskbar Cats, which is why
# ConfigStore carries the old file across on first run. Keep this in step with
# package.json's productName; a test checks that it is.
productName: Taskbar Cats
copyright: Copyright © 2026 PatrikSchweika

directories:
  # The packaged app is exactly what `npm run win:build` emitted, including the
  # package.json that build writes.
  app: build-win32
  # Both of these must be stated. electron-builder defaults them to build/ and
  # dist/, which this repository already uses for the GNOME extension and its
  # packed zip — it would otherwise treat the extension's output as installer
  # resources and write installers over the zip.
  buildResources: packaging
  output: dist/win32

# The taskbar helper, kept out of the asar archive entirely.
#
# A .node file has to be a real file on disk for LoadLibrary to open it, so it
# cannot live inside app.asar. asarUnpack would also work, but a plain file in
# resources/ is one less layer between the loader and the binary.
extraResources:
  - from: native/win32-shell/build/Release/win32_shell.node
    to: win32_shell.node

win:
  icon: src/assets/icons/app.ico
  # Shapes only, no architectures. electron-builder *adds* the ones named on
  # the command line to the ones a target declares rather than replacing them,
  # so pinning x64 here made `--arm64` build x64 as well, and emit a third
  # installer carrying both on top of that. The release workflow builds one
  # architecture per job and says which as `--x64` or `--arm64`.
  target:
    - nsis
    - zip

nsis:
  # A per-user install: no UAC prompt at all, which is the single biggest
  # difference to how much friction an end user meets.
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  runAfterFinish: true
  # The architecture is in the name because the release holds both, under one
  # latest.yml that names an exact file. Without it an ARM64 build would
  # overwrite the x64 installer that latest.yml points at.
  artifactName: Taskbar-Cats-${version}-windows-${arch}-setup.${ext}

# Where the app looks for updates.
#
# Nothing here uploads anything: `win:pack` always passes `--publish never`,
# and .github/workflows/release.yml attaches the files with the gh CLI. This
# block exists for the two files it makes electron-builder *write* — the
# app-update.yml baked into the package, which tells the installed app where to
# look, and the latest.yml beside the installer, which tells it what the newest
# release is. Both are only produced when an nsis target is built.
publish:
  provider: github
  owner: PatrikSchweika
  repo: taskbar-cats
