<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; img-src 'self'; script-src 'self'; style-src 'unsafe-inline'"
		/>
		<title>Taskbar Cats</title>
		<style>
			/*
			 * The window is transparent and click-through; nothing here may
			 * paint a background or the whole strip would go opaque.
			 */
			html,
			body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: transparent;
				cursor: default;
				user-select: none;
			}

			#stage {
				position: absolute;
				inset: 0;
			}

			/* Name tags: above the cats, never catching the pointer. */
			#tags {
				position: absolute;
				inset: 0;
				pointer-events: none;
			}

			.tag {
				position: absolute;
				top: 0;
				left: 0;
				background: rgba(20, 20, 20, 0.8);
				color: #fff;
				font:
					12px system-ui,
					sans-serif;
				border-radius: 4px;
				padding: 1px 6px;
				white-space: nowrap;
				pointer-events: none;
			}

			.cat {
				position: absolute;
				top: 0;
				left: 0;
				/* Flip about the sprite's centre, so a turning cat stays put. */
				transform-origin: 50% 50%;
				/* Pixel art: never smooth it. */
				image-rendering: pixelated;
				will-change: transform;
				pointer-events: none;
			}

			/*
			 * Arrange mode. The outline and tint take no room, so the sprite
			 * stays on the floor. Presses are hit-tested against the props in
			 * code, so the sprites themselves stay pointer-events: none.
			 */
			#stage.arranging .furniture {
				background: rgba(255, 255, 255, 0.12);
				border-radius: 6px;
				outline: 2px solid rgba(255, 255, 255, 0.7);
			}

			/* Stood where the user put it. An <img> has no ::after for a pin
			   glyph, so the outline turns the accent colour and thickens. */
			#stage.arranging .furniture.pinned {
				background: rgba(53, 132, 228, 0.2);
				outline: 3px solid rgba(53, 132, 228, 0.95);
			}

			/* Placed by overlay.ts: centred on the floor, above the furniture. */
			#arrange-bar {
				position: absolute;
				top: 0;
				left: 50%;
				transform: translateX(-50%);
				/* Above the stage, so no cat ever walks in front of it. */
				z-index: 1;
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 5px 6px 5px 12px;
				border-radius: 10px;
				background: rgba(30, 30, 30, 0.92);
				color: #ffffff;
				font:
					13px/1.3 "Segoe UI Variable Text",
					"Segoe UI",
					system-ui,
					sans-serif;
				white-space: nowrap;
			}
			/* `display: flex` above would otherwise beat the hidden attribute. */
			#arrange-bar[hidden] {
				display: none;
			}

			#arrange-bar button {
				font: inherit;
				color: #ffffff;
				background: rgba(255, 255, 255, 0.14);
				border: 1px solid rgba(255, 255, 255, 0.25);
				border-radius: 6px;
				padding: 3px 10px;
				cursor: pointer;
			}
			#arrange-bar button:hover {
				background: rgba(255, 255, 255, 0.24);
			}
		</style>
	</head>
	<body>
		<div id="stage"></div>
		<div id="tags"></div>
		<div id="arrange-bar" hidden>
			<span id="arrange-hint"></span>
			<button id="arrange-reset" type="button">Reset all</button>
			<button id="arrange-done" type="button">Done</button>
		</div>
		<script type="module" src="./overlay.js"></script>
	</body>
</html>
