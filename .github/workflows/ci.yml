name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 22.18 is the floor declared in engines: the first release where Node
        # strips TypeScript types without a flag, which tools/cli.ts relies on.
        node: ["22.18", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `node tools/cli.ts validate` compiles the GSettings schema.
      - name: Install glib-compile-schemas
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Validate schema, metadata and sprites
        run: npm run validate

      - name: Build
        run: npm run build

      # The overlay's TypeScript is platform-independent even though it only
      # runs on Windows, so compiling it here catches breakage without needing
      # a Windows runner. The native helper is the only part that cannot.
      - name: Build the Windows overlay
        run: npm run win:build

      - name: Test
        run: npm test

  windows:
    name: Windows backend
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # The one thing the Linux job cannot check: that the taskbar helper
      # actually compiles against the Windows SDK.
      - name: Build the taskbar helper
        run: npm run win:native

      - name: Build the overlay
        run: npm run win:build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Packaging is verified here rather than only at release time. The
      # collisions it has to avoid — build/ and dist/ already belong to the
      # GNOME extension — and the prebuilt helper landing in the right place
      # are both things that would otherwise be discovered by cutting a broken
      # release.
      # electron-builder cleans its output directory before building, and its
      # default output is dist/ — where the GNOME extension's packed zip lives.
      # A sentinel proves the override actually took effect, which checking for
      # the zip itself would not: dist/ is gitignored, so on a fresh checkout
      # there is nothing there to survive.
      - name: Leave a sentinel in dist/
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Set-Content -Path dist/sentinel.txt -Value "the extension zip lives here"

      - name: Package
        run: npm run win:pack

      - name: The helper is in the package
        shell: pwsh
        run: |
          $found = Get-ChildItem -Path dist/win32 -Recurse -Filter win32_shell.node
          if (-not $found) {
            Write-Error "win32_shell.node is not in the packaged output"
            exit 1
          }
          $found | ForEach-Object { Write-Host "found $($_.FullName)" }

      - name: The GNOME extension's output directory is untouched
        shell: pwsh
        run: |
          if (-not (Test-Path dist/sentinel.txt)) {
            Write-Error "electron-builder cleaned dist/ — it would have deleted the extension zip"
            exit 1
          }
          Write-Host "dist/ holds: $((Get-ChildItem dist).Name -join ', ')"

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: |
            dist/win32/*.exe
            dist/win32/*.zip
          if-no-files-found: error
          retention-days: 14

  sprites:
    name: Generated art is current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # The frames are committed so installing needs no toolchain. Regenerate them
      # and fail if the result differs from what is checked in — that catches a
      # hand-edited SVG, or a generator change whose output was not committed.
      - name: Regenerate sprites and icons
        run: npm run sprites

      - name: Committed frames match the generator
        run: git diff --exit-code -- src/assets
